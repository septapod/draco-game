<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draco - Enter the World</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a12;
      font-family: 'Space Mono', monospace;
      color: #e0d8c8;
    }
    .login-box {
      text-align: center;
      padding: 2.5rem;
      max-width: 360px;
      width: 90%;
    }
    .login-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.8rem;
      color: #FFB800;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: #8a8070;
      margin-bottom: 2rem;
    }
    .login-input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      background: #1a1a2e;
      border: 2px solid #333;
      border-radius: 6px;
      color: #e0d8c8;
      text-align: center;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-input:focus { border-color: #FFB800; }
    .login-input::placeholder { color: #555; }
    .login-btn {
      width: 100%;
      padding: 0.75rem;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      background: #FFB800;
      color: #0a0a12;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.9; }
    .login-btn:disabled { opacity: 0.5; cursor: wait; }
    .login-error {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #FF4136;
      min-height: 1.2em;
    }
    .login-home {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #666;
      text-decoration: none;
    }
    .login-home:hover { color: #FFB800; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1 class="login-title">DRACO</h1>
    <p class="login-subtitle">Speak the password to enter</p>
    <form id="login-form">
      <input type="password" id="password" class="login-input" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit" class="login-btn">Enter</button>
    </form>
    <p id="error" class="login-error"></p>
    <a href="/" class="login-home">Back to Codex</a>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const input = document.getElementById('password');
    const error = document.getElementById('error');
    const btn = form.querySelector('button');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input.value }),
        });

        if (resp.ok) {
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get('next') || '/game/';
        } else {
          error.textContent = 'Wrong password';
          input.value = '';
          input.focus();
        }
      } catch (err) {
        error.textContent = 'Connection error. Try again.';
      }

      btn.disabled = false;
    });
  </script>
</body>
</html>
